name: Test og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

# Offentlige verdier: prosjektadressen og den offentlige (publishable) nøkkelen.
# De ligger uansett synlig i appen. All beskyttelse ligger i innlogging og RLS.
# Kan overstyres med repo-variabler med samme navn.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://yfhflsjgyefpqayfmxhq.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_mkOUUvr49S_D4ddwsIouMQ_sUT8ib-D' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Alle økonomiberegninger og databasetester (RLS, isolasjon mellom brukere) må passere før noe publiseres
      - run: npm test
      - name: Sjekk at nøkkelen er den offentlige, ikke den hemmelige
        env:
          KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY mangler." && exit 1; fi
          case "$KEY" in sb_secret_*) echo "Dette er en hemmelig nøkkel. Bruk anon/publishable." && exit 1;; esac
          payload=$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          if echo "$payload" | grep -q '"role":"service_role"'; then
            echo "Dette er service_role-nøkkelen. Bruk anon/publishable." && exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
